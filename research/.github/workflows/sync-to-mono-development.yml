name: Sync split repo into monorepo development

on:
  push:
    branches: [main, development]
  workflow_dispatch:

env:
  MONO_REPO: riddhimanrana/orion
  MONO_TARGET_BRANCH: development
  PREFIX: research

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-research-to-mono-development
      cancel-in-progress: false

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MONO_REPO }}
          token: ${{ secrets.MONO_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Checkout split repo
        uses: actions/checkout@v4
        with:
          path: split
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "orion-sync-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Checkout monorepo target branch
        env:
          TARGET_BRANCH: ${{ env.MONO_TARGET_BRANCH }}
        run: |
          git fetch origin "$TARGET_BRANCH" || true
          if git ls-remote --heads origin "$TARGET_BRANCH" | grep -q "$TARGET_BRANCH"; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Sync split files into monorepo prefix
        id: sync
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX"
          rsync -a --delete --exclude ".git/" ./split/ "$PREFIX/"
          git add -A "$PREFIX"

          if git diff --cached --quiet; then
            echo "No changes to commit for $PREFIX"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(sync): $GITHUB_REPOSITORY@$GITHUB_SHA ($SOURCE_BRANCH) -> $PREFIX"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push monorepo development
        if: steps.sync.outputs.committed == 'true'
        env:
          TARGET_BRANCH: ${{ env.MONO_TARGET_BRANCH }}
        run: git push origin "$TARGET_BRANCH"
